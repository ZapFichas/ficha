project_id = "fichapro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://localhost:4173",
  "http://localhost:4174",
  "http://localhost:5174/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "20MiB"

[analytics]
enabled = false
