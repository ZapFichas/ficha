name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar site estático
        env:
          VITE_API_BASE: https://fichapro-api.zapfichas.workers.dev
          VITE_SUPABASE_URL: https://zprvmebwmoohksmfbnzn.supabase.co
          # Chave pública (anon). O RLS do Supabase protege os dados.
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwcnZtZWJ3bW9vaGtzbWZibnpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNzcyOTcsImV4cCI6MjEwOTg1MzI5N30.sLECaCNOQPcTWQuAi_19Axcg7g5r_n2VSTqKcpPo12U
          PANEL_URL: https://zapfichas.github.io/ficha/dashboard/
        run: node scripts/build-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
