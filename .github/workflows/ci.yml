name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar templates
        run: npm run templates:validate

      - name: Typecheck do Worker
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build (ficha + worker dry-run)
        run: npm run build
