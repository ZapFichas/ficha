name = "fichapro-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_URL = "https://zapfichas.github.io/ficha/tattoo"
FICHA_URL = "https://zapfichas.github.io/ficha/tattoo/write"
PANEL_URL = "https://zapfichas.github.io/ficha/dashboard"
FICHA_URL_TEMPLATE = "https://zapfichas.github.io/ficha/{nicho}/write/?t={slug}"
ENVIRONMENT = "staging"

# R2 ainda não habilitado na conta Cloudflare (código 10042).
# Após habilitar no dashboard e criar o bucket, descomente:
# [[r2_buckets]]
# binding = "FICHAS_BUCKET"
# bucket_name = "fichapro-fichas"

[[queues.producers]]
binding = "PDF_QUEUE"
queue = "fichapro-pdf"

[[queues.consumers]]
queue = "fichapro-pdf"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "fichapro-pdf-dlq"

[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = true
